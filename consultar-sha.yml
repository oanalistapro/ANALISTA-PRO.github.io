
name: Consultar SHA do ANALISTA PRO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar-sha:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Mostrar SHA-1 e SHA-256
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail

          printf '%s' "$APK_KEYSTORE_BASE64" |
            tr -d '\r\n\t ' |
            base64 --decode > "$RUNNER_TEMP/release.keystore"

          keytool -list -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias "$APK_KEY_ALIAS" \
            -storepass:env APK_STORE_PASSWORD |
            grep -E 'SHA1:|SHA256:'

          rm -f "$RUNNER_TEMP/release.keystore"
