
name: Criar APK ANALISTA PRO - Google

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p appandroid/app/src/main/java/com/analistapro/app
          mkdir -p appandroid/app/src/main/res/drawable

          if [ -f icon-192.png ]; then
            cp icon-192.png appandroid/app/src/main/res/drawable/launcher_icon.png
          elif [ -f icon-192-pro.png ]; then
            cp icon-192-pro.png appandroid/app/src/main/res/drawable/launcher_icon.png
          elif [ -f icon-512.png ]; then
            cp icon-512.png appandroid/app/src/main/res/drawable/launcher_icon.png
          else
            echo "ERRO: falta icon-192.png no repositorio"
            exit 1
          fi

          cat > appandroid/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AnalistaPro'
          include ':app'
          EOF

          cat > appandroid/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > appandroid/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > appandroid/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.analistapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.analistapro.app'
                  minSdk 24
                  targetSdk 35
                  versionCode = 100 + Integer.parseInt(
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
                  versionName = '3.' + (
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
              }

              signingConfigs {
                  release {
                      storeFile = file('../release.keystore')
                      storePassword = System.getenv('APK_STORE_PASSWORD') ?: ''
                      keyAlias = System.getenv('APK_KEY_ALIAS') ?: ''
                      keyPassword = System.getenv('APK_KEY_PASSWORD') ?: ''
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.browser:browser:1.8.0'
          }
          EOF

          cat > appandroid/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="ANALISTA PRO"
                  android:icon="@drawable/launcher_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > appandroid/app/src/main/java/com/analistapro/app/MainActivity.java <<'EOF'
          package com.analistapro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.browser.customtabs.CustomTabsIntent;

          public class MainActivity extends Activity {
              private static final String SITE =
                  "https://oanalistapro.github.io/ANALISTA-PRO.github.io/";

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(40, 40, 40, 40);
                  layout.setBackgroundColor(Color.rgb(7, 17, 29));

                  TextView title = new TextView(this);
                  title.setText("ANALISTA PRO");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  Button open = new Button(this);
                  open.setText("Abrir ANALISTA PRO");
                  open.setOnClickListener(v -> openSite());
                  layout.addView(open);

                  setContentView(layout);

                  if (state == null) {
                      openSite();
                  }
              }

              private void openSite() {
                  Uri url = Uri.parse(SITE);

                  try {
                      CustomTabsIntent tab =
                          new CustomTabsIntent.Builder()
                              .setShowTitle(true)
                              .build();

                      tab.launchUrl(this, url);

                  } catch (Exception e) {
                      try {
                          startActivity(
                              new Intent(Intent.ACTION_VIEW, url)
                          );
                      } catch (Exception ex) {
                          Toast.makeText(
                              this,
                              "Instale ou atualize o Chrome",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }
          }
          EOF

      - name: Recuperar assinatura do APK
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in APK_KEYSTORE_BASE64 APK_STORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            test -n "${!key}" || {
              echo "ERRO: falta o secret $key"
              exit 1
            }
          done

          printf '%s' "$APK_KEYSTORE_BASE64" |
            tr -d '\r\n\t ' |
            base64 --decode > appandroid/release.keystore

          test -s appandroid/release.keystore

          echo "APK_STORE_PASSWORD=$APK_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "APK_KEY_ALIAS=$APK_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "APK_KEY_PASSWORD=$APK_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd appandroid
          gradle --no-daemon :app:assembleRelease

      - name: Preparar APK
        shell: bash
        run: |
          cp appandroid/app/build/outputs/apk/release/app-release.apk \
            ANALISTA_PRO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA_PRO_ANDROID
          path: ANALISTA_PRO.apk
