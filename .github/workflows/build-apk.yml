
name: Criar APK ANALISTA PRO - Google

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verificar projeto Android verdadeiro
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          FILE="app/src/main/java/com/analistapro/app/MainActivity.java"

          test -f "$FILE"

          grep -Fq 'AnalistaProNative/1' "$FILE"
          grep -Fq 'loginGoogle()' "$FILE"
          grep -Fq 'GetGoogleIdOption' "$FILE"
          grep -Fq 'Entrar com Google' "$FILE"

          echo "Projeto Android nativo encontrado."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar assinatura original
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > release.keystore
          test -s release.keystore

      - name: Compilar APK nativo
        shell: bash
        env:
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -e
          gradle :app:assembleRelease --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-GOOGLE-NATIVO
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
