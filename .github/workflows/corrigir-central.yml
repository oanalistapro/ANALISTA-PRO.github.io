
name: Corrigir integração CENTRAL ADM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir botão e integração
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          html = p.read_text(encoding="utf-8")

          marcador = "<!-- INTEGRAÇÃO ANALISTA PRO → CENTRAL ADM -->"

          if marcador not in html:
              raise SystemExit(
                  "Integração não encontrada. "
                  "Nenhuma alteração foi realizada."
              )

          inicio = html.index(marcador)

          # Preserva todas as funções anteriores.
          html = html[:inicio]

          integracao = Path("central-adm.html")

          if not integracao.exists():
              raise SystemExit(
                  "Arquivo central-adm.html não encontrado."
              )

          html += integracao.read_text(encoding="utf-8")
          p.write_text(html, encoding="utf-8")
          print("Integração corrigida.")
          PY

      - name: Publicar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
          else
            git commit -m "Corrigir integração Central ADM"
            git push
          fi
