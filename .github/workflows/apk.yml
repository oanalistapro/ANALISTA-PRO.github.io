
name: GERAR APK ANALISTA PRO GOOGLE NATIVO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Preparar assinatura
        shell: bash
        env:
          KEYSTORE: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE STORE_PASS KEY_ALIAS KEY_PASS; do
            if [[ -z "${!var}" ]]; then
              echo "::error::Falta configurar $var"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/analistapro"
          printf '%s' "$KEYSTORE" | base64 -d \
            > "$RUNNER_TEMP/analistapro/release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/analistapro/release.jks" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Criar aplicativo Android
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo "::error::Falta GOOGLE_WEB_CLIENT_ID"
            exit 1
          fi

          mkdir -p androidapk/app/src/main/java/com/analistapro/app
          mkdir -p androidapk/app/src/main/res/values

          cat > androidapk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AnalistaPro'
          include ':app'
          EOF

          cat > androidapk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > androidapk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > androidapk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.analistapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.analistapro.app'
                  minSdk 26
                  targetSdk 35
                  versionCode Integer.parseInt(
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
                  versionName '1.' + (
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('APK_KEYSTORE_PATH'))
                      storePassword System.getenv('APK_STORE_PASSWORD')
                      keyAlias System.getenv('APK_KEY_ALIAS')
                      keyPassword System.getenv('APK_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-auth:21.3.0'
          }
          EOF

          cat > androidapk/app/src/main/res/values/strings.xml <<EOF
          <resources>
            <string name="app_name">ANALISTA PRO</string>
            <string name="google_web_client_id">${GOOGLE_WEB_CLIENT_ID}</string>
          </resources>
          EOF

          cat > androidapk/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET"/>

            <application
                android:label="@string/app_name"
                android:theme="@android:style/Theme.Material.Light.NoActionBar"
                android:usesCleartextTraffic="false"
                android:allowBackup="false">

              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:windowSoftInputMode="adjustResize">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > androidapk/app/src/main/java/com/analistapro/app/MainActivity.java <<'EOF'
          package com.analistapro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;

          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInClient;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.tasks.Task;

          public class MainActivity extends Activity {

              private static final String URL =
                "https://oanalistapro.github.io/ANALISTA-PRO.github.io/";

              private static final int GOOGLE_REQUEST = 7101;

              private WebView web;
              private GoogleSignInClient googleClient;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(7,16,26));
                  getWindow().setNavigationBarColor(Color.rgb(7,16,26));

                  GoogleSignInOptions options =
                    new GoogleSignInOptions.Builder(
                      GoogleSignInOptions.DEFAULT_SIGN_IN
                    )
                    .requestEmail()
                    .requestIdToken(
                      getString(R.string.google_web_client_id)
                    )
                    .build();

                  googleClient = GoogleSignIn.getClient(this, options);

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(7,16,26));

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  settings.setUserAgentString(
                    settings.getUserAgentString()
                    + " AnalistaProNative/1"
                  );

                  web.setWebChromeClient(new WebChromeClient());

                  web.setWebViewClient(new WebViewClient() {
                    @Override
                    public boolean shouldOverrideUrlLoading(
                      WebView view,
                      android.webkit.WebResourceRequest request
                    ) {
                      Uri uri = request.getUrl();

                      if ("analistapro".equals(uri.getScheme())) {
                        if ("login".equals(uri.getHost())) {
                          iniciarGoogle();
                        }
                        return true;
                      }

                      if ("https".equals(uri.getScheme())
                          && "oanalistapro.github.io".equals(uri.getHost())) {
                        return false;
                      }

                      try {
                        startActivity(
                          new Intent(Intent.ACTION_VIEW, uri)
                        );
                      } catch (Exception ignored) {}

                      return true;
                    }
                  });

                  web.addJavascriptInterface(
                    new NativeBridge(),
                    "AnalistaAndroid"
                  );

                  FrameLayout root = new FrameLayout(this);
                  root.addView(
                    web,
                    new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                    )
                  );

                  setContentView(root);
                  web.loadUrl(URL);
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void loginGoogle() {
                    runOnUiThread(() -> iniciarGoogle());
                  }

                  @JavascriptInterface
                  public void openExternal(String url) {
                    runOnUiThread(() -> {
                      try {
                        Uri uri = Uri.parse(url);
                        if (!"https".equals(uri.getScheme())) return;
                        startActivity(
                          new Intent(Intent.ACTION_VIEW, uri)
                        );
                      } catch (Exception ignored) {}
                    });
                  }
              }

              private void iniciarGoogle() {
                if (!paginaOficial()) {
                  mostrarErro("Abra a pagina oficial do ANALISTA PRO.");
                  return;
                }

                try {
                  // Limpa a selecao nativa anterior para
                  // permitir escolher outra conta Google.
                  googleClient.signOut().addOnCompleteListener(this, task -> {
                    try {
                      Intent intent = googleClient.getSignInIntent();
                      startActivityForResult(intent, GOOGLE_REQUEST);
                    } catch (Exception e) {
                      mostrarErro(
                        "Nao foi possivel abrir o Google: "
                        + e.getMessage()
                      );
                    }
                  });
                } catch (Exception e) {
                  mostrarErro(
                    "Falha ao iniciar Google: " + e.getMessage()
                  );
                }
              }

              @Override
              protected void onActivityResult(
                int requestCode,
                int resultCode,
                Intent data
              ) {
                super.onActivityResult(
                  requestCode,
                  resultCode,
                  data
                );

                if (requestCode != GOOGLE_REQUEST) return;

                try {
                  Task<GoogleSignInAccount> task =
                    GoogleSignIn.getSignedInAccountFromIntent(data);

                  GoogleSignInAccount account =
                    task.getResult(ApiException.class);

                  if (account == null || account.getIdToken() == null) {
                    mostrarErro("Google nao retornou um token valido.");
                    return;
                  }

                  enviarTokenParaSite(account.getIdToken());

                } catch (ApiException e) {
                  int status = e.getStatusCode();

                  android.util.Log.e(
                    "AnalistaGoogle",
                    "Falha Google Sign-In: " + status,
                    e
                  );

                  if (status == 12501) {
                    mostrarErro("Login Google cancelado.");
                  } else if (status == 10 || status == 12500) {
                    mostrarErro(
                      "Google OAuth erro " + status
                      + ". Confira SHA-1, pacote Android "
                      + "e GOOGLE_WEB_CLIENT_ID."
                    );
                  } else {
                    mostrarErro(
                      "Falha Google. Codigo: " + status
                    );
                  }
                } catch (Exception e) {
                  mostrarErro(
                    "Erro no retorno Google: " + e.getMessage()
                  );
                }
              }

              private boolean paginaOficial() {
                if (web == null) return false;
                try {
                  Uri uri = Uri.parse(web.getUrl());
                  return "https".equals(uri.getScheme())
                    && "oanalistapro.github.io".equals(uri.getHost())
                    && uri.getPath() != null
                    && uri.getPath().startsWith(
                      "/ANALISTA-PRO.github.io/"
                    );
                } catch (Exception e) {
                  return false;
                }
              }

              private void enviarTokenParaSite(String token) {
                if (!paginaOficial()) {
                  mostrarErro("Pagina nao autorizada.");
                  return;
                }

                String escaped = org.json.JSONObject.quote(token);

                web.evaluateJavascript(
                  "(function(){"
                  + "if(typeof window.__analistaNativeGoogleToken"
                  + "==='function'){"
                  + "window.__analistaNativeGoogleToken("
                  + escaped
                  + ");return 'OK';}"
                  + "return 'BRIDGE_AUSENTE';"
                  + "})()",
                  result -> {
                    if ("\"BRIDGE_AUSENTE\"".equals(result)) {
                      mostrarErro(
                        "Funcao de login Firebase nao encontrada."
                      );
                    }
                  }
                );
              }

              private void mostrarErro(String mensagem) {
                runOnUiThread(() ->
                  Toast.makeText(
                    this,
                    mensagem,
                    Toast.LENGTH_LONG
                  ).show()
                );
              }

              @Override
              public void onBackPressed() {
                if (web != null && web.canGoBack()) {
                  web.goBack();
                } else {
                  super.onBackPressed();
                }
              }

              @Override
              protected void onDestroy() {
                if (web != null) {
                  web.destroy();
                }
                super.onDestroy();
              }
          }
          EOF

      - name: Compilar APK
        shell: bash
        env:
          APK_KEYSTORE_PATH: ${{ runner.temp }}/analistapro/release.jks
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd androidapk
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cp androidapk/app/build/outputs/apk/release/app-release.apk \
            dist/ANALISTA-PRO.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/ANALISTA-PRO.apk

      - name: Mostrar SHA-1 e SHA-256
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs \
            dist/ANALISTA-PRO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-GOOGLE
          path: dist/ANALISTA-PRO.apk
          if-no-files-found: error

      - name: Publicar APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="analista-pro-android"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/ANALISTA-PRO.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist/ANALISTA-PRO.apk \
              --title "ANALISTA PRO Android" \
              --notes "APK com Google Sign-In nativo."
          fi
