
name: GERAR APK ANALISTA PRO GOOGLE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          FILE="app/src/main/java/com/analistapro/app/MainActivity.java"

          test -f "$FILE"

          grep -Fq 'AnalistaProNative/1' "$FILE"
          grep -Fq 'loginGoogle()' "$FILE"
          grep -Fq 'GetGoogleIdOption' "$FILE"
          grep -Fq 'Entrar com Google' "$FILE"

          echo "Projeto Android encontrado."
          echo "Login Google nativo encontrado."

      - name: Restaurar assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode > release.keystore

          test -s release.keystore

      - name: Compilar APK
        shell: bash
        env:
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -e
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Preparar APK instalavel
        shell: bash
        run: |
          set -e

          mkdir -p dist

          cp app/build/outputs/apk/release/app-release.apk \
            dist/ANALISTA-PRO.apk

          test -s dist/ANALISTA-PRO.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/ANALISTA-PRO.apk

          echo "APK compilado e assinatura verificada."

      - name: Disponibilizar APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-INSTALAVEL
          path: dist/ANALISTA-PRO.apk
          retention-days: 30

      - name: Publicar APK no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="analista-pro-android"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/ANALISTA-PRO.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist/ANALISTA-PRO.apk \
              --title "ANALISTA PRO Android" \
              --notes "APK instalavel do ANALISTA PRO."
          fi

          echo "APK publicado."
