
name: GERAR APK ANALISTA PRO NATIVO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Preparar assinatura permanente
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for nome in APK_KEYSTORE_BASE64 APK_STORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            if [[ -z "${!nome}" ]]; then
              echo "::error::Secret ausente: $nome"
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/analistapro"

          printf '%s' "$APK_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/analistapro/release.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/analistapro/release.jks" \
            -storepass "$APK_STORE_PASSWORD" \
            -alias "$APK_KEY_ALIAS" \
            > /dev/null

          echo "Chave permanente validada."

      - name: Criar projeto Android
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID ausente."
            exit 1
          fi

          mkdir -p androidapk/app/src/main/java/com/analistapro/app
          mkdir -p androidapk/app/src/main/res/values

          cat > androidapk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AnalistaPro'
          include ':app'
          EOF

          cat > androidapk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > androidapk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > androidapk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.analistapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.analistapro.app'
                  minSdk 26
                  targetSdk 35
                  versionCode Integer.parseInt(
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
                  versionName '1.' + (
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('APK_KEYSTORE_PATH'))
                      storePassword System.getenv('APK_STORE_PASSWORD')
                      keyAlias System.getenv('APK_KEY_ALIAS')
                      keyPassword System.getenv('APK_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }

          dependencies {
              implementation 'androidx.credentials:credentials:1.3.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
              implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
          }
          EOF

          cat > androidapk/app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">ANALISTA PRO</string>
              <string name="google_web_client_id">${GOOGLE_WEB_CLIENT_ID}</string>
          </resources>
          EOF

          cat > androidapk/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > androidapk/app/src/main/java/com/analistapro/app/MainActivity.java <<'EOF'
          package com.analistapro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;

          import androidx.credentials.CredentialManager;
          import androidx.credentials.GetCredentialRequest;
          import androidx.credentials.GetCredentialResponse;
          import androidx.credentials.Credential;
          import androidx.credentials.CustomCredential;
          import androidx.credentials.exceptions.GetCredentialException;
          import androidx.credentials.exceptions.NoCredentialException;

          import com.google.android.libraries.identity.googleid.GetGoogleIdOption;
          import com.google.android.libraries.identity.googleid.GoogleIdTokenCredential;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final String URL =
                  "https://oanalistapro.github.io/ANALISTA-PRO.github.io/";

              private WebView web;
              private final ExecutorService executor =
                  Executors.newSingleThreadExecutor();

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(7,16,26));
                  getWindow().setNavigationBarColor(Color.rgb(7,16,26));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(7,16,26));

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  settings.setUserAgentString(
                      settings.getUserAgentString()
                      + " AnalistaProNative/1"
                  );

                  web.setWebChromeClient(new WebChromeClient());

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view,
                          android.webkit.WebResourceRequest request
                      ) {
                          Uri uri = request.getUrl();

                          if ("analistapro".equals(uri.getScheme())) {
                              if ("login".equals(uri.getHost())) {
                                  googleLogin();
                              }
                              return true;
                          }

                          if ("https".equals(uri.getScheme())
                              && "oanalistapro.github.io".equals(uri.getHost())) {
                              return false;
                          }

                          try {
                              startActivity(
                                  new Intent(Intent.ACTION_VIEW, uri)
                              );
                          } catch (Exception ignored) {}

                          return true;
                      }
                  });

                  web.addJavascriptInterface(
                      new NativeBridge(),
                      "AnalistaAndroid"
                  );

                  FrameLayout root = new FrameLayout(this);

                  root.addView(
                      web,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  setContentView(root);
                  web.loadUrl(URL);
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void loginGoogle() {
                      runOnUiThread(() -> googleLogin());
                  }

                  @JavascriptInterface
                  public void openExternal(String url) {
                      runOnUiThread(() -> {
                          try {
                              Uri uri = Uri.parse(url);
                              if (!"https".equals(uri.getScheme())) return;
                              startActivity(
                                  new Intent(Intent.ACTION_VIEW, uri)
                              );
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void googleLogin() {
                  try {
                      GetGoogleIdOption option =
                          new GetGoogleIdOption.Builder()
                              .setFilterByAuthorizedAccounts(false)
                              .setServerClientId(
                                  getString(R.string.google_web_client_id)
                              )
                              .setAutoSelectEnabled(false)
                              .build();

                      GetCredentialRequest request =
                          new GetCredentialRequest.Builder()
                              .addCredentialOption(option)
                              .build();

                      CredentialManager manager =
                          CredentialManager.create(this);

                      manager.getCredentialAsync(
                          this,
                          request,
                          null,
                          executor,
                          new androidx.credentials.CredentialManagerCallback<
                              GetCredentialResponse,
                              GetCredentialException
                          >() {
                              @Override
                              public void onResult(GetCredentialResponse response) {
                                  try {
                                      Credential credential =
                                          response.getCredential();

                                      if (!(credential instanceof CustomCredential)) {
                                          throw new Exception(
                                              "Tipo de credencial nao suportado"
                                          );
                                      }

                                      CustomCredential custom =
                                          (CustomCredential) credential;

                                      if (!GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL
                                          .equals(custom.getType())) {
                                          throw new Exception(
                                              "Credencial Google invalida"
                                          );
                                      }

                                      GoogleIdTokenCredential google =
                                          GoogleIdTokenCredential.createFrom(
                                              custom.getData()
                                          );

                                      String token = google.getIdToken();

                                      runOnUiThread(() -> {
                                          String escaped =
                                              org.json.JSONObject.quote(token);

                                          web.evaluateJavascript(
                                              "(function(){"
                                              + "if(typeof window.__analistaNativeGoogleToken==='function'){"
                                              + "window.__analistaNativeGoogleToken("
                                              + escaped
                                              + ");return 'OK';}"
                                              + "return 'BRIDGE_AUSENTE';"
                                              + "})()",
                                              result -> {
                                                  if ("\"BRIDGE_AUSENTE\"".equals(result)) {
                                                      showError(
                                                          "O site precisa receber o token Google nativo."
                                                      );
                                                  }
                                              }
                                          );
                                      });

                                  } catch (Exception e) {
                                      showError(
                                          "Erro na credencial: " + e.getMessage()
                                      );
                                  }
                              }

                              @Override
                              public void onError(GetCredentialException e) {
                                  android.util.Log.e(
                                      "AnalistaGoogle",
                                      "Falha Credential Manager: "
                                      + e.getClass().getSimpleName(),
                                      e
                                  );

                                  if (e instanceof NoCredentialException) {
                                      showError(
                                          "Google nao encontrou credenciais. "
                                          + "Verifique a conta Google, Play Services "
                                          + "e o OAuth Android."
                                      );
                                  } else {
                                      showError(
                                          "Google: "
                                          + e.getClass().getSimpleName()
                                          + " - "
                                          + e.getMessage()
                                      );
                                  }
                              }
                          }
                      );

                  } catch (Exception e) {
                      showError("Erro ao iniciar Google: " + e.getMessage());
                  }
              }

              private void showError(String message) {
                  runOnUiThread(() ->
                      Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_LONG
                      ).show()
                  );
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  executor.shutdown();
                  if (web != null) web.destroy();
                  super.onDestroy();
              }
          }
          EOF

      - name: Compilar APK release
        shell: bash
        env:
          APK_KEYSTORE_PATH: ${{ runner.temp }}/analistapro/release.jks
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd androidapk
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp androidapk/app/build/outputs/apk/release/app-release.apk \
            dist/ANALISTA-PRO.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/ANALISTA-PRO.apk

      - name: Mostrar SHA-1 e SHA-256
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ASSINATURA PERMANENTE ====="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --print-certs \
            dist/ANALISTA-PRO.apk

          echo "===== FIM ====="

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-RELEASE
          path: dist/ANALISTA-PRO.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="analista-pro-android"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/ANALISTA-PRO.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist/ANALISTA-PRO.apk \
              --title "ANALISTA PRO Android" \
              --notes "APK Android com assinatura permanente."
          fi

          echo "APK publicado com sucesso."
