
name: GERAR APK ANALISTA PRO NATIVO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Criar projeto Android com WebView
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo "ERRO: Configure GOOGLE_WEB_CLIENT_ID nos Secrets."
            exit 1
          fi

          mkdir -p androidapk/app/src/main/java/com/analistapro/app
          mkdir -p androidapk/app/src/main/res/values

          cat > androidapk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'AnalistaPro'
          include ':app'
          EOF

          cat > androidapk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > androidapk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > androidapk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.analistapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.analistapro.app'
                  minSdk 26
                  targetSdk 35
                  versionCode Integer.parseInt(
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
                  versionName '1.' + (
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
              }
          }

          dependencies {
              implementation 'androidx.credentials:credentials:1.3.0'
              implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
              implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
          }
          EOF

          cat > androidapk/app/src/main/res/values/strings.xml <<EOF
          <resources>
              <string name="app_name">ANALISTA PRO</string>
              <string name="google_web_client_id">${GOOGLE_WEB_CLIENT_ID}</string>
          </resources>
          EOF

          cat > androidapk/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > androidapk/app/src/main/java/com/analistapro/app/MainActivity.java <<'EOF'
          package com.analistapro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.JavascriptInterface;
          import android.graphics.Color;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import android.content.Intent;
          import android.net.Uri;

          import androidx.credentials.CredentialManager;
          import androidx.credentials.GetCredentialRequest;
          import androidx.credentials.GetCredentialResponse;
          import androidx.credentials.Credential;
          import androidx.credentials.CustomCredential;
          import androidx.credentials.exceptions.GetCredentialException;

          import com.google.android.libraries.identity.googleid.GetGoogleIdOption;
          import com.google.android.libraries.identity.googleid.GoogleIdTokenCredential;

          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final String URL =
                  "https://oanalistapro.github.io/ANALISTA-PRO.github.io/";

              private WebView web;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(7, 16, 26));
                  getWindow().setNavigationBarColor(Color.rgb(7, 16, 26));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.rgb(7, 16, 26));

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);

                  String ua = settings.getUserAgentString();
                  settings.setUserAgentString(
                      ua + " AnalistaProNative/1"
                  );

                  web.setWebChromeClient(new WebChromeClient());

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                          WebView view,
                          android.webkit.WebResourceRequest request
                      ) {
                          Uri uri = request.getUrl();

                          if ("analistapro".equals(uri.getScheme())) {
                              if ("login".equals(uri.getHost())) {
                                  googleLogin();
                              }
                              return true;
                          }

                          String host = uri.getHost();
                          if ("https".equals(uri.getScheme()) &&
                              "oanalistapro.github.io".equals(host)) {
                              return false;
                          }

                          try {
                              startActivity(
                                  new Intent(
                                      Intent.ACTION_VIEW,
                                      uri
                                  )
                              );
                          } catch (Exception ignored) {}

                          return true;
                      }
                  });

                  web.addJavascriptInterface(
                      new NativeBridge(),
                      "AnalistaAndroid"
                  );

                  FrameLayout root = new FrameLayout(this);
                  root.addView(
                      web,
                      new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  );

                  setContentView(root);
                  web.loadUrl(URL);
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void loginGoogle() {
                      runOnUiThread(() -> googleLogin());
                  }

                  @JavascriptInterface
                  public void openExternal(String url) {
                      runOnUiThread(() -> {
                          try {
                              Uri uri = Uri.parse(url);
                              if (!"https".equals(uri.getScheme())) return;
                              startActivity(
                                  new Intent(
                                      Intent.ACTION_VIEW,
                                      uri
                                  )
                              );
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void googleLogin() {
                  GetGoogleIdOption googleOption =
                      new GetGoogleIdOption.Builder()
                          .setFilterByAuthorizedAccounts(false)
                          .setServerClientId(
                              getString(R.string.google_web_client_id)
                          )
                          .setAutoSelectEnabled(false)
                          .build();

                  GetCredentialRequest request =
                      new GetCredentialRequest.Builder()
                          .addCredentialOption(googleOption)
                          .build();

                  CredentialManager manager =
                      CredentialManager.create(this);

                  manager.getCredentialAsync(
                      this,
                      request,
                      null,
                      Executors.newSingleThreadExecutor(),
                      new androidx.credentials.CredentialManagerCallback<
                          GetCredentialResponse,
                          GetCredentialException
                      >() {
                          @Override
                          public void onResult(GetCredentialResponse response) {
                              try {
                                  Credential credential =
                                      response.getCredential();

                                  if (!(credential instanceof CustomCredential)) {
                                      throw new Exception("Credencial invalida");
                                  }

                                  CustomCredential custom =
                                      (CustomCredential) credential;

                                  if (!GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL
                                      .equals(custom.getType())) {
                                      throw new Exception("Tipo de credencial invalido");
                                  }

                                  GoogleIdTokenCredential google =
                                      GoogleIdTokenCredential.createFrom(
                                          custom.getData()
                                      );

                                  String token = google.getIdToken();

                                  runOnUiThread(() -> {
                                      String escaped =
                                          org.json.JSONObject.quote(token);

                                      web.evaluateJavascript(
                                          "if(window.__analistaNativeGoogleToken)"
                                          + "{window.__analistaNativeGoogleToken("
                                          + escaped + ");}",
                                          null
                                      );
                                  });

                              } catch (Exception e) {
                                  showError(e.getMessage());
                              }
                          }

                          @Override
                          public void onError(GetCredentialException e) {
                              showError(
                                  "Falha ao entrar com Google: "
                                  + e.getMessage()
                              );
                          }
                      }
                  );
              }

              private void showError(String message) {
                  runOnUiThread(() ->
                      Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_LONG
                      ).show()
                  );
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd androidapk
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp androidapk/app/build/outputs/apk/debug/app-debug.apk \
            dist/ANALISTA-PRO.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/ANALISTA-PRO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-NATIVO
          path: dist/ANALISTA-PRO.apk
          if-no-files-found: error

      - name: Publicar APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="analista-pro-android"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/ANALISTA-PRO.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist/ANALISTA-PRO.apk \
              --title "ANALISTA PRO Android" \
              --notes "APK nativo do ANALISTA PRO."
          fi
