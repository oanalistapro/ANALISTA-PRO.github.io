
name: GERAR APK ANALISTA PRO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK"

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android completo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p androidapk/app/src/main/java/com/analistapro/app

          cat > androidapk/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AnalistaPro'
          include ':app'
          EOF

          cat > androidapk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > androidapk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > androidapk/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.analistapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.analistapro.app'
                  minSdk 24
                  targetSdk 35
                  versionCode Integer.parseInt(
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
                  versionName '1.' + (
                      System.getenv('GITHUB_RUN_NUMBER') ?: '1'
                  )
              }
          }

          dependencies {
              implementation 'androidx.browser:browser:1.8.0'
          }
          EOF

          cat > androidapk/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:label="ANALISTA PRO"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > androidapk/app/src/main/java/com/analistapro/app/MainActivity.java <<'EOF'
          package com.analistapro.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.Toast;

          import androidx.browser.customtabs.CustomTabsIntent;

          public class MainActivity extends Activity {

              private static final String SITE =
                  "https://oanalistapro.github.io/ANALISTA-PRO.github.io/";

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(36, 36, 36, 36);
                  layout.setBackgroundColor(Color.rgb(7, 17, 29));

                  TextView title = new TextView(this);
                  title.setText("ANALISTA PRO");
                  title.setTextColor(Color.CYAN);
                  title.setTextSize(27);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  TextView info = new TextView(this);
                  info.setText(
                      "Gerenciamento de campeonatos"
                  );
                  info.setTextColor(Color.WHITE);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, 25, 0, 25);
                  layout.addView(info);

                  Button entrar = new Button(this);
                  entrar.setText("ABRIR ANALISTA PRO");
                  entrar.setOnClickListener(v -> abrirSite());
                  layout.addView(entrar);

                  setContentView(layout);

                  if (state == null) {
                      abrirSite();
                  }
              }

              private void abrirSite() {
                  Uri url = Uri.parse(SITE);

                  try {
                      CustomTabsIntent tabs =
                          new CustomTabsIntent.Builder()
                              .setShowTitle(false)
                              .setToolbarColor(
                                  Color.rgb(7, 17, 29)
                              )
                              .build();

                      tabs.launchUrl(this, url);

                  } catch (Exception e) {
                      try {
                          startActivity(
                              new Intent(
                                  Intent.ACTION_VIEW,
                                  url
                              )
                          );
                      } catch (Exception ex) {
                          Toast.makeText(
                              this,
                              "Navegador nao encontrado.",
                              Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }
          }
          EOF

          echo "Projeto Android criado."

      - name: Compilar APK instalavel
        shell: bash
        run: |
          set -euo pipefail

          cd androidapk
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Preparar e verificar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp androidapk/app/build/outputs/apk/debug/app-debug.apk \
            dist/ANALISTA-PRO.apk

          test -s dist/ANALISTA-PRO.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/ANALISTA-PRO.apk

          echo "APK gerado e assinatura verificada."
          ls -lh dist/ANALISTA-PRO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-ANDROID
          path: dist/ANALISTA-PRO.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK no GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="analista-pro-android"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/ANALISTA-PRO.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist/ANALISTA-PRO.apk \
              --title "ANALISTA PRO Android" \
              --notes "APK instalavel do ANALISTA PRO."
          fi

          echo "APK publicado."
