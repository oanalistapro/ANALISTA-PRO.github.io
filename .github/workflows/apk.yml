
name: GERAR APK ANALISTA PRO GOOGLE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK nao encontrado."
            exit 1
          fi

          echo "SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager \
              | head -n 1)
          fi

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo "SDK Android configurado."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar arquivos Android
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/AndroidManifest.xml

          FILE="app/src/main/java/com/analistapro/app/MainActivity.java"

          test -f "$FILE"

          grep -Fq 'AnalistaProNative/1' "$FILE"
          grep -Fq 'loginGoogle()' "$FILE"
          grep -Fq 'GetGoogleIdOption' "$FILE"
          grep -Fq 'Entrar com Google' "$FILE"

          echo "Projeto Android nativo encontrado."
          echo "Login Google encontrado."

      - name: Restaurar assinatura original
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode > release.keystore

          test -s release.keystore

          echo "Assinatura restaurada."

      - name: Compilar APK Release
        shell: bash
        env:
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Preparar APK instalavel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            ! -name '*unsigned*' \
            | head -n 1)

          test -n "$APK"
          test -s "$APK"

          cp "$APK" dist/ANALISTA-PRO.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/ANALISTA-PRO.apk

          echo "APK validado."
          ls -lh dist/ANALISTA-PRO.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA-PRO-INSTALAVEL
          path: dist/ANALISTA-PRO.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK para download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="analista-pro-android"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/ANALISTA-PRO.apk \
              --clobber
          else
            gh release create "$TAG" \
              dist/ANALISTA-PRO.apk \
              --title "ANALISTA PRO Android" \
              --notes "APK Android instalavel."
          fi

          echo "APK publicado."
