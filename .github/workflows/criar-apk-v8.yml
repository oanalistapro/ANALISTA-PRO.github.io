
name: ANALISTA PRO V8 - Google Nativo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Localizar e extrair projeto V8
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos do repositorio:"
          find . -maxdepth 4 -type f | head -80

          ZIP=$(find . -type f \
            -iname "*GOOGLE*NATIVO*V8*.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP V8 nao encontrado."
            echo "Confira se o ZIP esta na branch Principal."
            exit 1
          fi

          echo "Arquivo encontrado: $ZIP"

          mkdir -p "$RUNNER_TEMP/v8"
          unzip -o "$ZIP" -d "$RUNNER_TEMP/v8"

          PROJETO=$(find "$RUNNER_TEMP/v8" \
            -name settings.gradle -type f \
            -printf '%h\n' | head -1)

          if [ -z "$PROJETO" ]; then
            echo "ERRO: Projeto Gradle nao encontrado no ZIP."
            exit 1
          fi

          cp -r "$PROJETO/app" ./app
          cp "$PROJETO/build.gradle" ./build.gradle
          cp "$PROJETO/settings.gradle" ./settings.gradle
          cp "$PROJETO/gradle.properties" ./gradle.properties

          test -f app/google-services.json
          test -f app/build.gradle

          echo "Projeto Android extraido."

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Recuperar assinatura original
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$APK_KEYSTORE_BASE64"

          printf '%s' "$APK_KEYSTORE_BASE64" |
            tr -d '\r\n\t ' |
            base64 --decode > release.keystore

          test -s release.keystore

      - name: Compilar APK Google Nativo
        shell: bash
        env:
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon :app:assembleRelease

          cp app/build/outputs/apk/release/app-release.apk \
            ANALISTA_PRO_V8.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA_PRO_V8_ANDROID
          path: ANALISTA_PRO_V8.apk
