
name: ANALISTA PRO V8 - APK Google Nativo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Verificando arquivos Android..."

          test -f settings.gradle || {
            echo "ERRO: falta settings.gradle"
            exit 1
          }

          test -f build.gradle || {
            echo "ERRO: falta build.gradle"
            exit 1
          }

          test -f app/build.gradle || {
            echo "ERRO: falta app/build.gradle"
            exit 1
          }

          test -f app/google-services.json || {
            echo "ERRO: falta app/google-services.json"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERRO: falta AndroidManifest.xml"
            exit 1
          }

          test -f app/src/main/java/com/analistapro/app/MainActivity.java || {
            echo "ERRO: falta MainActivity.java"
            exit 1
          }

          echo "Arquivos Android encontrados!"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Recuperar assinatura original
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$APK_KEYSTORE_BASE64"

          printf '%s' "$APK_KEYSTORE_BASE64" |
            tr -d '\r\n\t ' |
            base64 --decode > release.keystore

          test -s release.keystore

      - name: Compilar APK
        shell: bash
        env:
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon :app:assembleRelease

          cp app/build/outputs/apk/release/app-release.apk \
            ANALISTA_PRO_V8.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ANALISTA_PRO_V8_ANDROID
          path: ANALISTA_PRO_V8.apk
